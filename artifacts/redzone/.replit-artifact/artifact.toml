kind = "web"
previewPath = "/"
title = "Red Zone Selling Coach"
version = "1.0.0"
id = "artifacts/redzone"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19987

[services.development]
run = "pnpm --filter @workspace/redzone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/redzone", "run", "build" ]
run = "pnpm --filter @workspace/redzone run serve"

[services.env]
PORT = "19987"
BASE_PATH = "/"
